services:
  avahi:
    image: flungo/avahi:latest
    container_name: avahi
    network_mode: host
    restart: always
    environment:
      SERVER_HOST_NAME: umbrel
      SERVER_DOMAIN_NAME: local
      SERVER_USE_IPV4: "yes"
      SERVER_USE_IPV6: "yes"
      SERVER_ALLOW_INTERFACES: eth0
      SERVER_ENABLE_DBUS: "no"

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=umbrel_main_network"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - umbrel_main_network
    restart: always

  umbrel:
    image: ghcr.io/pedrog022/umbrel:latest
    container_name: umbrel
    pid: host
    volumes:
      - ./umbrel:/data
      - ./.env:/data/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umbrel-dashboard.rule=Host(`${SUBDOMAIN}.${DOMAIN}`) || Host(`umbrel.local`)"
      - "traefik.http.routers.umbrel-dashboard.entrypoints=web"
      - "traefik.http.services.umbrel-dashboard.loadbalancer.server.port=80"
    networks:
      - umbrel_main_network
    restart: always
    stop_grace_period: 1m

networks:
  umbrel_main_network:
    name: umbrel_main_network
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/16
          gateway: 10.21.0.1