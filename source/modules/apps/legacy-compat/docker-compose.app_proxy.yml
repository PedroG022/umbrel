version: '3.7'

services:
  app_proxy:
    image: getumbrel/app-proxy:1.7.0@sha256:ec0de0b944a2e63d52fdd82b3760d90a35f8b442d17a8407afdee3af3e842d5a
    # build: ../../../../../../containers/app-proxy
    user: '1000:1000'
    restart: on-failure
    hostname: $APP_PROXY_HOSTNAME
    ports:
      - '${APP_PROXY_PORT}:${APP_PROXY_PORT}'
    volumes:
      - '${APP_MANIFEST_FILE}:/extra/umbrel-app.yml:ro'
      - '${TOR_DATA_DIR}:/var/lib/tor:ro'
      - '${APP_DATA_DIR}:/data:ro'
    environment:
      LOG_LEVEL: info
      PROXY_PORT: $APP_PROXY_PORT
      PROXY_AUTH_ADD: 'true'
      PROXY_AUTH_WHITELIST:
      PROXY_AUTH_BLACKLIST:
      APP_HOST:
      APP_PORT:
      AUTH_SERVICE_PORT: $AUTH_PORT
      UMBREL_AUTH_SECRET: $UMBREL_AUTH_SECRET
      MANAGER_IP: $MANAGER_IP
      MANAGER_PORT: 3006
      JWT_SECRET: $JWT_SECRET
    labels:
      - "traefik.enable=true"
      # Mode-aware App Router (web for Modes 1 & 3 HTTP; websecure with TLS for Mode 2 HTTPS)
      - "traefik.http.routers.${APP_ID}.rule=Host(`${APP_ID}.${APP_DOMAIN_BASE}`)"
      - "traefik.http.routers.${APP_ID}.entrypoints=${APP_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_ID}.tls=${APP_ENABLE_TLS:-false}"
      - "traefik.http.routers.${APP_ID}.service=${APP_ID}"
      # Service definition
      - "traefik.http.services.${APP_ID}.loadbalancer.server.port=${APP_PROXY_PORT}"

